name: News agent

on:
  schedule:
    - cron: "*/15 * * * *"   # checks every 15 minutes; outside fight nights it only works every 3 hours
  workflow_dispatch:
    inputs:
      force:
        description: "Run a full check right now"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: news-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - run: pip install -r agent/requirements.txt

      - name: Look for news
        run: python agent/run.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}

      - name: Save the agent's memory
        run: |
          git config user.name "undercard-agent"
          git config user.email "undercard-agent@users.noreply.github.com"
          git add agent/state.json
          if [ "${{ vars.AUTO_PUBLISH }}" = "true" ]; then git add site/data/stories.json; fi
          git commit -m "Agent: update memory" || exit 0
          git push

      - name: Send new drafts for approval
        if: vars.AUTO_PUBLISH != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: agent/new-stories
          base: main
          add-paths: site/data/stories.json
          commit-message: "Agent: new story drafts"
          title: "New stories from the news agent"
          body-path: agent/last_run.md
          delete-branch: true
