name: Results agent

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes; it only works while a card is on, plus one daily sweep
  workflow_dispatch:
    inputs:
      force:
        description: "Run a full check right now"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fights-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - run: pip install -r agent/requirements.txt

      - name: Check
        working-directory: agent
        run: python results.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_FAST_MODEL: ${{ vars.CLAUDE_FAST_MODEL }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}

      - name: Publish safe changes
        run: |
          git config user.name "fightwhen-agent"
          git config user.email "fightwhen-agent@users.noreply.github.com"
          for f in agent/results_cache.json site/data/status.json; do [ -f "$f" ] && git add "$f"; done; true
          if [ "${{ vars.AUTO_PUBLISH_SAFE }}" != "false" ]; then git add site/data/fights.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "Results agent: safe updates"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1

      - name: Put risky changes in a pull request
        if: hashFiles('agent/results_review.json') != ''
        run: |
          git checkout -- site/data/fights.json 2>/dev/null || true
          [ -s agent/results_review.json ] && cp agent/results_review.json site/data/fights.json || true

      - uses: peter-evans/create-pull-request@v7
        if: hashFiles('agent/results_review.json') != ''
        with:
          branch: agent/results-review
          base: main
          add-paths: site/data/fights.json
          commit-message: "Results agent: changes to review"
          title: "Fight results that need your OK"
          body-path: agent/results_report.md
          delete-branch: true
