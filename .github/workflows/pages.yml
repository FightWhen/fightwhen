name: Publish website

on:
  push:
    branches: [main]
    paths: ["site/**", "agent/pages.py"]
  workflow_run:
    workflows: ["News agent", "Schedule agent", "Results agent"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Get fonts and Pillow for the share images
        continue-on-error: true
        run: |
          pip install --quiet pillow
          mkdir -p agent/fonts
          curl -sSfL -o agent/fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf
          curl -sSfL -o agent/fonts/IBMPlexMono-SemiBold.ttf https://github.com/google/fonts/raw/main/ofl/ibmplexmono/IBMPlexMono-SemiBold.ttf
      - name: Build one page per fight, plus the sitemap
        run: python3 agent/pages.py
        env:
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Tell Bing and other IndexNow search engines what changed
        continue-on-error: true
        run: |
          sleep 20
          python3 - <<'PY'
          import json, urllib.request
          urls = [u for u in open("site/urls.txt").read().split() if u][:500]
          body = json.dumps({"host": "fightwhen.com", "key": "27159deb70212d00f6e7f9ea253b96a2",
                             "keyLocation": "https://fightwhen.com/27159deb70212d00f6e7f9ea253b96a2.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              print("IndexNow:", urllib.request.urlopen(req, timeout=30).status, len(urls), "pages")
          except Exception as e:
              print("IndexNow skipped:", e)
          PY
