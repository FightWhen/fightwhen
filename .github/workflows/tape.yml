name: Fighter stats agent

on:
  schedule:
    - cron: "17 11 * * *"   # once a day, 5:17 AM Chicago (11:17 UTC)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tape-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - run: pip install -r agent/requirements.txt

      - name: Fill in fighter stats
        run: python agent/tape.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Send changes for approval
        uses: peter-evans/create-pull-request@v7
        with:
          branch: agent/fighter-stats
          base: main
          add-paths: |
            site/data/fights.json
            agent/tape_cache.json
          commit-message: "Agent: fighter stats"
          title: "Fighter stats from the stats agent"
          body-path: agent/tape_report.md
          delete-branch: true
